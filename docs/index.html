<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Family card</title>
<style>
:root{
  --bg:#f4f2ec; --card:#fff; --ink:#16213a; --mute:#5d6577; --line:#dcd8cc;
  --g:#12802f; --r:#c61f2e; --k:#16213a; --star:#e0a100; --starbg:#fff6d8;
  --scale:1; --navh:92px;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#0f1218; --card:#1a1f29; --ink:#eef0f4; --mute:#9aa3b5; --line:#2c3443;
    --g:#56d06f; --r:#ff6f72; --k:#eef0f4; --star:#ffc93c; --starbg:#3a3113; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-bottom:calc(var(--navh) + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}

/* gate */
#gate{min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:28px;max-width:420px;margin:0 auto}
#gate h1{margin:0;font-size:22px}
#gate p{margin:0;color:var(--mute);line-height:1.4}
#gate input{font-size:20px;padding:14px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%}
#gate button{font-size:18px;font-weight:700;padding:14px;border:0;border-radius:10px;background:var(--ink);color:var(--bg)}
#gateMsg{color:var(--r);min-height:1.4em;font-weight:600}

/* tools row */
#tools{display:flex;gap:8px;padding:10px 10px 4px}
#tools button{flex:1;padding:10px 4px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-weight:700;font-size:15px}
#key{margin:6px 10px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;line-height:1.45;font-size:16px}
#key p{margin:0 0 8px}#key p:last-child{margin:0}
#key b.g{color:var(--g)}#key b.r{color:var(--r)}
#empty{margin:16px 10px;padding:16px;border:2px dashed var(--line);border-radius:12px;color:var(--mute);font-size:17px;line-height:1.4}

/* sections */
section h2{position:sticky;top:0;z-index:5;margin:0;padding:8px 14px;font-size:15px;letter-spacing:.12em;text-transform:uppercase;
  background:var(--ink);color:var(--bg);display:flex;justify-content:space-between}
section h2 small{font-weight:600;letter-spacing:.04em;opacity:.75;text-transform:none}
section{scroll-margin-top:0}
.hand{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;width:100%;text-align:left;
  padding:9px 10px 8px 12px;background:var(--card);border:0;border-bottom:1px solid var(--line);border-left:6px solid transparent;cursor:pointer}
.hand.on{background:var(--starbg);border-left-color:var(--star)}
.tiles{font-weight:800;font-size:calc(clamp(17px,5.5vw,30px) * var(--scale));line-height:1.18;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.alt{display:flex;flex-wrap:wrap;gap:0 .42em}
.alt span{white-space:nowrap}
.or{font-size:12px;font-weight:700;color:var(--mute);letter-spacing:.1em;text-transform:uppercase;margin:1px 0}
.g{color:var(--g)}.r{color:var(--r)}.k{color:var(--k)}
.val{display:flex;align-items:center;gap:6px;font-weight:800}
.val i{font-style:normal;font-size:13px;line-height:1;padding:4px 7px;border-radius:6px;border:2px solid var(--r);color:var(--r)}
.val.c i{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.val b{font-size:calc(22px * var(--scale));line-height:1.15}
.note{grid-column:1/-1;font-size:calc(14.5px * var(--scale));color:var(--mute);line-height:1.25}
.hand.on .note::before{content:"\2605  ";color:var(--star)}
body.only .hand:not(.on), body.only section.none{display:none}

/* bottom nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:2px solid var(--ink);
  display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav button{height:46px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:none;
  font-weight:800;font-size:14.5px;letter-spacing:.02em;padding:0}
nav button.cur{background:var(--ink);color:var(--bg)}
nav button#tabStar{color:var(--star);font-size:17px}
nav button#tabStar.cur{background:var(--star);color:#1b1500}

/* photos */
#photos{position:fixed;inset:0;z-index:20;background:#000;overflow:auto;-webkit-overflow-scrolling:touch}
#photos button{position:fixed;top:10px;right:10px;z-index:21;padding:12px 18px;border:0;border-radius:10px;background:#fff;color:#000;font-weight:800;font-size:16px}
#photos img{display:block;width:100%;margin-bottom:6px}
#photos img.big{width:240%;max-width:none}
#photos p{color:#ccc;padding:14px;margin:0;font-size:15px}
[hidden]{display:none!important}
</style>
</head>
<body>

<div id="gate" hidden>
  <h1>Family card</h1>
  <p>This page is locked. Open it with the family link, or type the code here.</p>
  <input id="code" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Code">
  <button id="go">Open</button>
  <div id="gateMsg"></div>
</div>

<div id="app" hidden>
  <div id="tools">
    <button id="bKey">Key</button>
    <button id="bSize">Text size</button>
    <button id="bPhotos">Card photos</button>
  </div>
  <div id="key" hidden></div>
  <div id="empty" hidden>You have no marked hands yet. Tap any hand to mark it, and it will show here by itself.</div>
  <main id="list"></main>
  <nav id="nav"></nav>
</div>

<div id="photos" hidden>
  <button id="bClose">Close</button>
  <p>These are the photos of the real card. Tap a photo to enlarge it, then drag to move around.</p>
  <div id="imgs"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const store = { get(k, d){ try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
                set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
let key, stars = new Set(store.get('mj26.stars', []));

async function unseal(file){
  const buf = new Uint8Array(await (await fetch(file, { cache: 'no-cache' })).arrayBuffer());
  return crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, key, buf.slice(12));
}
async function unlock(pass){
  const meta = await (await fetch('meta.json', { cache: 'no-cache' })).json();
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(meta.salt), iterations: meta.iter, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  return JSON.parse(new TextDecoder().decode(await unseal('card.enc')));
}

function altHtml(a){
  return '<div class="alt">' + a.split(';').map(seg => {
    const [c, t] = seg.split('|');
    return t.split(' ').map(w => `<span class="${c}">${w}</span>`).join('');
  }).join('') + '</div>';
}

function render(card){
  const list = $('#list'), nav = $('#nav');
  $('#key').innerHTML =
    `<p><b>${card.note}</b></p>` +
    '<p>Each colour stands for one suit: <b class="g">green</b>, <b class="r">red</b> and <b>dark</b>. You choose which suit plays each colour.</p>' +
    '<p>F is a Flower. D is a Dragon. N, E, W and S are the Winds. 0 is the White Dragon.</p>' +
    '<p>A matching Dragon is Green with Bams, Red with Craks, and White with Dots.</p>' +
    '<p><b>X</b> means the hand may be exposed, so you may call tiles for it. <b>C</b> means the hand is concealed, so you may call only the last tile for Mah Jongg.</p>' +
    '<p>The number beside each hand is its value.</p>';
  list.innerHTML = card.sections.map(s =>
    `<section id="s-${s.id}"><h2><span>${s.name}</span><small>${s.hands.length} hands</small></h2>` +
    s.hands.map((h, i) => {
      const id = s.id + '.' + i;
      return `<button class="hand${stars.has(id) ? ' on' : ''}" data-id="${id}" aria-pressed="${stars.has(id)}">` +
        `<div class="tiles">${h.alts.map(altHtml).join('<div class="or">or</div>')}</div>` +
        `<div class="val ${h.x === 'C' ? 'c' : 'x'}"><i>${h.x}</i><b>${h.v}</b></div>` +
        (h.note ? `<div class="note">${h.note}</div>` : '<div class="note"></div>') + '</button>';
    }).join('') + '</section>').join('');
  nav.innerHTML = '<button id="tabStar" aria-label="Marked hands">★ <span id="nStar"></span></button>' +
    card.sections.map(s => `<button data-go="${s.id}">${s.tab}</button>`).join('');
  syncStars();

  list.addEventListener('click', e => {
    const h = e.target.closest('.hand'); if (!h) return;
    const id = h.dataset.id;
    stars.has(id) ? stars.delete(id) : stars.add(id);
    h.classList.toggle('on', stars.has(id));
    h.setAttribute('aria-pressed', stars.has(id));
    store.set('mj26.stars', [...stars]);
    syncStars();
  });
  nav.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.id === 'tabStar') { setOnly(!document.body.classList.contains('only')); window.scrollTo(0, 0); return; }
    setOnly(false);
    document.getElementById('s-' + b.dataset.go).scrollIntoView();
  });
  const seen = new IntersectionObserver(es => {
    for (const e of es) if (e.isIntersecting && !document.body.classList.contains('only'))
      mark(e.target.id.slice(2));
  }, { rootMargin: '-10% 0px -75% 0px' });
  document.querySelectorAll('section').forEach(s => seen.observe(s));
}
function mark(id){
  document.querySelectorAll('nav button[data-go]').forEach(b => b.classList.toggle('cur', b.dataset.go === id));
}
function setOnly(on){
  document.body.classList.toggle('only', on);
  $('#tabStar').classList.toggle('cur', on);
  if (on) mark(null);
  syncStars();
}
function syncStars(){
  $('#nStar').textContent = stars.size || '';
  document.querySelectorAll('section').forEach(s => s.classList.toggle('none', !s.querySelector('.hand.on')));
  $('#empty').hidden = !(document.body.classList.contains('only') && stars.size === 0);
}

const sizes = [1, 1.18, 0.86];
function applySize(){ document.documentElement.style.setProperty('--scale', sizes[store.get('mj26.size', 0) % sizes.length]); }
$('#bSize').onclick = () => { store.set('mj26.size', (store.get('mj26.size', 0) + 1) % sizes.length); applySize(); };
$('#bKey').onclick = () => { $('#key').hidden = !$('#key').hidden; };
$('#bPhotos').onclick = async () => {
  $('#photos').hidden = false;
  if ($('#imgs').childElementCount) return;
  for (const n of ['p1', 'p2', 'p3']) {
    const img = new Image();
    img.src = URL.createObjectURL(new Blob([await unseal(n + '.enc')], { type: 'image/jpeg' }));
    img.alt = 'Photo of the card, panel ' + n.slice(1);
    img.onclick = () => img.classList.toggle('big');
    $('#imgs').append(img);
  }
};
$('#bClose').onclick = () => { $('#photos').hidden = true; };

let lock;
async function awake(){ try { if (document.visibilityState === 'visible') lock = await navigator.wakeLock.request('screen'); } catch {} }
document.addEventListener('visibilitychange', awake);
document.addEventListener('click', () => { if (!lock || lock.released) awake(); });

async function start(pass, typed){
  try {
    const card = await unlock(pass);
    store.set('mj26.pass', pass);
    $('#gate').hidden = true; $('#app').hidden = false;
    applySize(); render(card); awake();
  } catch (err) {
    $('#app').hidden = true; $('#gate').hidden = false;
    $('#gateMsg').textContent = typed ? 'That code did not open the card.' : '';
  }
}
$('#go').onclick = () => start($('#code').value.trim().toLowerCase(), true);
$('#code').addEventListener('keydown', e => { if (e.key === 'Enter') $('#go').click(); });
const first = decodeURIComponent(location.hash.slice(1)) || store.get('mj26.pass', '');
first ? start(first, false) : ($('#gate').hidden = false);
</script>
</body>
</html>
